name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 21+ is required for the quoted test glob (node --test glob
          # patterns); 22 matches local dev. Node 20 made `npm test` fail with
          # "Could not find 'src/**/*.test.ts'" on every PR since the quoting.
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Owner and safety guards
        shell: bash
        run: |
          if compgen -G "src/guards/*.test.ts" > /dev/null; then
            npx tsx --test src/guards/*.test.ts
          else
            echo "No dedicated guard tests on this revision"
          fi

      # Import every library module, but not the server entrypoint: importing
      # dist/index.js starts Express + cron and makes CI wait forever.
      - name: Load every library module
        run: |
          npm run build
          node -e '
            const { readdirSync, statSync } = require("node:fs");
            const { join } = require("node:path");
            const walk = (d) => readdirSync(d).flatMap((f) => {
              const p = join(d, f);
              return statSync(p).isDirectory() ? walk(p) : p;
            });
            const files = walk("dist").filter(
              (f) =>
                f.endsWith(".js") &&
                !f.endsWith(".test.js") &&
                f !== "dist/index.js",
            );
            (async () => {
              for (const f of files) await import("./" + f);
              console.log(`loaded ${files.length} module(s)`);
              process.exit(0);
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
          '

  # D285 / D322 — Canon-consistent PRs pass without Josh's approval.
  # A change to the LOCKED section or a canon definition file fails
  # unless the canon-change label was approved by Josh. Fail path
  # prints "Never auto-merge." `check` stays required too.
  locked-canon:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Locked canon golden text
        run: npx tsx --test src/guards/lockedCanon.test.ts src/lib/lockedCanon.ts
      - name: Block auto-merge when locked canon files or rules change
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          npx tsx src/lib/lockedCanonGateCli.ts
