<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Deliverability Wizard · Campaign archive</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise"></div>

    <div class="app">
      <aside class="sidebar">
        <div>
          <div class="logo-row">
            <div class="brand-mark small">DW</div>
            <div>
              <strong>Deliverability</strong>
              <span>Campaign archive</span>
            </div>
          </div>
          <nav>
            <button type="button" class="nav-item active" data-view="campaigns">
              Campaigns
            </button>
            <button type="button" class="nav-item" data-view="replies">
              Replies <span class="badge" id="reply-count">0</span>
            </button>
          </nav>
        </div>
        <div class="sidebar-footer">
          <div class="user-chip">
            <span>J</span>
            <div>
              <strong>Archive demo</strong>
              <small>pre-delete mirror</small>
            </div>
          </div>
          <p class="fine-print" id="rail-note"></p>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <p class="eyebrow" id="view-eyebrow">Restored clients</p>
            <h2 id="view-title">Campaigns</h2>
          </div>
          <div class="top-right">
            <label class="search">
              <span class="sr">Filter</span>
              <input id="filter" type="search" placeholder="Filter…" />
            </label>
            <div class="health-pill"><span></span> Demo · redacted</div>
          </div>
        </header>

        <section id="view-campaigns" class="panel active">
          <div id="stat-row" class="kpi-grid"></div>
          <article class="surface">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Supabase mirror</p>
                <h3>Nieto · MSRS · Positive</h3>
              </div>
              <span class="muted">Sent / reply totals from before the delete</span>
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Campaign</th>
                    <th>Status</th>
                    <th>Leads</th>
                    <th>Sent</th>
                    <th>Replied</th>
                    <th>Positive</th>
                    <th>Bounced</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="campaign-rows"></tbody>
              </table>
            </div>
          </article>
        </section>

        <section id="view-replies" class="panel">
          <div class="inbox">
            <aside class="surface thread-list" id="thread-list"></aside>
            <article class="surface thread-pane" id="thread-pane">
              <div class="empty muted">Select a reply</div>
            </article>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
