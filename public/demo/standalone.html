<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Deliverability Wizard · Campaign archive</title>
    <style>
:root {
  --bg: #090d12;
  --panel: #10161e;
  --panel-2: #151d27;
  --line: #24303d;
  --text: #edf2f7;
  --muted: #8c9aaa;
  --accent: #58e6a9;
  --accent-2: #6da7ff;
  --warn: #ffc968;
  --danger: #ff7b83;
  --shadow: 0 24px 80px rgb(0 0 0 / 28%);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.2;
  background:
    radial-gradient(circle at 14% 2%, rgb(88 230 169 / 12%), transparent 28rem),
    radial-gradient(circle at 90% 90%, rgb(109 167 255 / 10%), transparent 32rem);
}

.app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--line);
  background: rgb(12 17 23 / 94%);
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 28px;
}

.logo-row strong,
.logo-row span {
  display: block;
}

.logo-row span {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.brand-mark {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent);
  color: #062318;
  font-weight: 900;
  letter-spacing: -0.06em;
}

.brand-mark.small {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  font-size: 13px;
}

nav {
  display: grid;
  gap: 4px;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #93a2b2;
  text-align: left;
  padding: 11px 12px;
  border-radius: 10px;
  font-weight: 700;
}

.nav-item:hover,
.nav-item.active {
  background: var(--panel-2);
  color: var(--text);
}

.badge {
  float: right;
  min-width: 20px;
  padding: 2px 6px;
  border-radius: 999px;
  text-align: center;
  background: rgb(88 230 169 / 15%);
  color: var(--accent);
  font-size: 10px;
}

.sidebar-footer {
  display: grid;
  gap: 14px;
}

.user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.user-chip > span {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #223142;
  color: var(--accent);
  font-weight: 900;
}

.user-chip strong,
.user-chip small {
  display: block;
}

.user-chip small {
  color: var(--muted);
}

.fine-print {
  color: #697686;
  font-size: 11px;
  line-height: 1.5;
  margin: 0;
  padding: 0 4px;
}

main {
  min-width: 0;
  padding: 28px clamp(20px, 4vw, 54px) 54px;
}

.topbar {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 26px;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 11px;
  font-weight: 800;
}

h2,
h3,
p {
  margin-top: 0;
}

h2 {
  margin-bottom: 0;
  font-size: 28px;
  letter-spacing: -0.035em;
}

h3 {
  margin-bottom: 0;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.muted {
  color: var(--muted);
}

.health-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #9cabb8;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 12px;
  white-space: nowrap;
}

.health-pill span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

.search input {
  width: min(260px, 70vw);
  border: 1px solid var(--line);
  background: #0c1117;
  color: var(--text);
  border-radius: 12px;
  padding: 11px 14px;
  outline: none;
}

.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgb(88 230 169 / 10%);
}

.panel {
  display: none;
}

.panel.active {
  display: block;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 14px;
}

.kpi {
  min-height: 118px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 16px;
  padding: 20px;
}

.kpi span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.kpi strong {
  display: block;
  margin-top: 18px;
  font-size: 32px;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
}

.surface {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 8px 30px rgb(0 0 0 / 10%);
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 20px;
}

.table-wrap {
  overflow: auto;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.data-table th,
.data-table td {
  padding: 13px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}

.data-table th {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 700;
}

.data-table tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: rgb(21 29 39 / 70%);
}

.campaign-name {
  font-weight: 700;
}

.campaign-ids {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: 700;
  background: rgb(88 230 169 / 12%);
  color: var(--accent);
}

.status-pill.drafted {
  background: rgb(140 154 170 / 12%);
  color: var(--muted);
}

.num {
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}

.num.pos {
  color: var(--accent);
  font-weight: 700;
}

.num.bounce {
  color: var(--danger);
}

.linkish {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--accent-2);
  font-weight: 700;
  padding: 0;
}

.inbox {
  display: grid;
  grid-template-columns: minmax(280px, 360px) 1fr;
  gap: 14px;
  min-height: calc(100vh - 160px);
}

.thread-list {
  padding: 0;
  overflow: auto;
  max-height: calc(100vh - 160px);
}

.thread-item {
  width: 100%;
  appearance: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  text-align: left;
  padding: 14px 16px;
  display: grid;
  gap: 7px;
}

.thread-item:hover,
.thread-item.active {
  background: var(--panel-2);
}

.thread-item .who {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: baseline;
}

.thread-item .who strong {
  font-size: 14px;
}

.thread-item .meta {
  color: var(--muted);
  font-size: 12px;
}

.thread-item .preview {
  color: #b7c2cd;
  font-size: 13px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.cat {
  display: inline-flex;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  background: rgb(88 230 169 / 12%);
  color: var(--accent);
}

.cat.interested {
  background: rgb(109 167 255 / 14%);
  color: var(--accent-2);
}

.thread-pane {
  padding: 0;
  display: flex;
  flex-direction: column;
  min-height: 520px;
}

.thread-pane .empty {
  margin: auto;
}

.thread-head {
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--line);
}

.thread-head h3 {
  margin-bottom: 10px;
}

.thread-head .row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  color: var(--muted);
  font-size: 13px;
  align-items: center;
}

.blur-email {
  display: inline-block;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 0.04em;
  color: transparent;
  text-shadow: 0 0 8px #8c9aaa;
  background: #1a2330;
  border-radius: 4px;
  padding: 0 5px;
  user-select: none;
}

.offer-redact {
  display: inline-block;
  background: #0c1117;
  color: #0c1117;
  border-radius: 3px;
  padding: 0 3px;
  user-select: none;
  filter: blur(5px);
}

.thread-body {
  padding: 22px 24px 28px;
  white-space: pre-wrap;
  line-height: 1.55;
  font-size: 15px;
  overflow: auto;
  color: #dce4ee;
}

@media (max-width: 980px) {
  .app {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: relative;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .inbox {
    grid-template-columns: 1fr;
  }

  .thread-list {
    max-height: 280px;
  }
}

</style>

<script>
(() => {
  const state = {
    data: null,
    view: "campaigns",
    filter: "",
    selectedReply: 0,
    campaignFocus: null,
  };

  const els = {
    viewEyebrow: document.getElementById("view-eyebrow"),
    viewTitle: document.getElementById("view-title"),
    replyCount: document.getElementById("reply-count"),
    railNote: document.getElementById("rail-note"),
    filter: document.getElementById("filter"),
    statRow: document.getElementById("stat-row"),
    campaignRows: document.getElementById("campaign-rows"),
    viewCampaigns: document.getElementById("view-campaigns"),
    viewReplies: document.getElementById("view-replies"),
    threadList: document.getElementById("thread-list"),
    threadPane: document.getElementById("thread-pane"),
  };

  function fmt(n) {
    return Number(n || 0).toLocaleString("en-US");
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  function decorateBody(text) {
    return escapeHtml(text)
      .replace(
        /[A-Za-z0-9•]+\@[A-Za-z0-9•]+\.[A-Za-z]+/g,
        (m) => `<span class="blur-email">${m}</span>`,
      )
      .replace(/████+/g, (m) => `<span class="offer-redact">${m}</span>`);
  }

  function matchesFilter(hay) {
    const q = state.filter.trim().toLowerCase();
    if (!q) return true;
    return hay.toLowerCase().includes(q);
  }

  function setView(view) {
    state.view = view;
    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.view === view);
    });
    els.viewCampaigns.classList.toggle("active", view === "campaigns");
    els.viewReplies.classList.toggle("active", view === "replies");
    els.viewEyebrow.textContent =
      view === "campaigns" ? "Restored clients" : "Inbound replies";
    els.viewTitle.textContent = view === "campaigns" ? "Campaigns" : "Replies";
    els.filter.placeholder =
      view === "campaigns" ? "Filter campaigns…" : "Filter replies…";
    render();
  }

  function repliesVisible() {
    return (state.data?.replies || []).filter((r) => {
      if (
        state.campaignFocus != null &&
        r.campaignOldId !== state.campaignFocus
      ) {
        return false;
      }
      return matchesFilter(
        [
          r.campaignName,
          r.category,
          r.fromName,
          r.company,
          r.subject,
          r.body,
        ].join(" "),
      );
    });
  }

  function renderStats() {
    const camps = state.data.campaigns || [];
    const totals = camps.reduce(
      (acc, c) => {
        acc.sent += c.sent || 0;
        acc.replied += c.replied || 0;
        acc.positive += c.positive || 0;
        acc.bounced += c.bounced || 0;
        return acc;
      },
      { sent: 0, replied: 0, positive: 0, bounced: 0 },
    );
    els.statRow.innerHTML = [
      ["Sent", totals.sent],
      ["Replied", totals.replied],
      ["Positive", totals.positive],
      ["Bounced", totals.bounced],
    ]
      .map(
        ([label, value]) =>
          `<div class="kpi"><span>${label}</span><strong>${fmt(value)}</strong></div>`,
      )
      .join("");
  }

  function renderCampaigns() {
    const rows = (state.data.campaigns || []).filter((c) =>
      matchesFilter(`${c.name} ${c.oldId} ${c.newId}`),
    );
    els.campaignRows.innerHTML = rows
      .map((c) => {
        const drafted = String(c.status || "").toUpperCase() === "DRAFTED";
        return `<tr>
          <td>
            <span class="campaign-name">${escapeHtml(c.name)}</span>
            <span class="campaign-ids">#${c.oldId} → #${c.newId}</span>
          </td>
          <td><span class="status-pill ${drafted ? "drafted" : ""}">${escapeHtml(c.status || "COMPLETED")}</span></td>
          <td class="num">${fmt(c.leads)}</td>
          <td class="num">${fmt(c.sent)}</td>
          <td class="num">${fmt(c.replied)}</td>
          <td class="num pos">${fmt(c.positive)}</td>
          <td class="num bounce">${fmt(c.bounced)}</td>
          <td><button type="button" class="linkish" data-open-replies="${c.oldId}">Replies</button></td>
        </tr>`;
      })
      .join("");
  }

  function renderReplies() {
    const list = repliesVisible();
    els.replyCount.textContent = String((state.data.replies || []).length);
    if (!list.length) {
      els.threadList.innerHTML =
        '<div class="empty muted" style="padding:24px">No replies match.</div>';
      els.threadPane.innerHTML =
        '<div class="empty muted">Select a reply</div>';
      return;
    }
    if (state.selectedReply >= list.length) state.selectedReply = 0;
    els.threadList.innerHTML = list
      .map((r, i) => {
        const catClass =
          r.category === "Positive Reply" ? "" : "interested";
        return `<button type="button" class="thread-item ${i === state.selectedReply ? "active" : ""}" data-reply="${i}">
          <div class="who">
            <strong>${escapeHtml(r.fromName)}${r.company ? ` · ${escapeHtml(r.company)}` : ""}</strong>
            <span class="cat ${catClass}">${escapeHtml(r.category)}</span>
          </div>
          <div class="meta">${escapeHtml(r.campaignName)} · <span class="blur-email">${escapeHtml(r.fromEmailMasked)}</span></div>
          <div class="preview">${escapeHtml(r.body)}</div>
        </button>`;
      })
      .join("");

    const r = list[state.selectedReply];
    const when = r.at
      ? new Date(r.at).toLocaleString("en-US", {
          dateStyle: "medium",
          timeStyle: "short",
        })
      : "";
    const catClass = r.category === "Positive Reply" ? "" : "interested";
    els.threadPane.innerHTML = `
      <div class="thread-head">
        <h3>${escapeHtml(r.subject)}</h3>
        <div class="row">
          <span class="cat ${catClass}">${escapeHtml(r.category)}</span>
          <span>${escapeHtml(r.fromName)}</span>
          <span class="blur-email">${escapeHtml(r.fromEmailMasked)}</span>
          <span>${escapeHtml(r.campaignName)}</span>
          <span>${escapeHtml(when)}</span>
        </div>
      </div>
      <div class="thread-body">${decorateBody(r.body)}</div>`;
  }

  function render() {
    if (!state.data) return;
    if (state.view === "campaigns") {
      renderStats();
      renderCampaigns();
    } else {
      renderReplies();
    }
  }

  document.querySelectorAll(".nav-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.campaignFocus = null;
      setView(btn.dataset.view);
    });
  });

  els.filter.addEventListener("input", () => {
    state.filter = els.filter.value;
    render();
  });

  els.campaignRows.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-open-replies]");
    if (!btn) return;
    state.campaignFocus = Number(btn.getAttribute("data-open-replies"));
    state.selectedReply = 0;
    setView("replies");
  });

  els.threadList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-reply]");
    if (!btn) return;
    state.selectedReply = Number(btn.getAttribute("data-reply"));
    renderReplies();
  });

  Promise.resolve(window.__DEMO_DATA__).then((data) => {
      state.data = data;
      els.railNote.textContent = data.note || "";
      els.replyCount.textContent = String((data.replies || []).length);
      setView("campaigns");
    })
    .catch((err) => {
      els.viewTitle.textContent = "Failed to load";
      els.railNote.textContent = String(err.message || err);
    });
})();

</script>
  </body>
</html>
